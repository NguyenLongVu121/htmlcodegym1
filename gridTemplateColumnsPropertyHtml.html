<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành grid-template-columns</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2 style="text-align: center; margin-top: 20px">
      Thực hành Thuộc tính grid-template-columns
    </h2>

    <h3>Ví dụ 1: Chia 3 cột đều nhau với độ rộng cố định (150px)</h3>
    <div class="grid-container grid-1">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
      <div class="item">Item 6</div>
    </div>

    <h3>Ví dụ 2: Sử dụng đơn vị linh hoạt (1fr 2fr 1fr) và auto</h3>
    <div class="grid-container grid-2">
      <div class="item">Item A</div>
      <div class="item">Item B (2fr)</div>
      <div class="item">Item C</div>
      <div class="item">Item D</div>
      <div class="item">Item E (2fr)</div>
      <div class="item">Item F</div>
    </div>
  </body>
</html>
