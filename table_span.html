<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Gộp ô trong bảng</title>
  </head>
  <body>
    <h2>Thời khóa biểu</h2>

    <!-- Tạo bảng với đường viền border="1" -->
    <table border="1">
      <!-- Hàng 1: Tiêu đề các cột -->
      <tr>
        <th>Thứ</th>
        <th>Môn học</th>
        <th>Giáo viên</th>
      </tr>

      <!-- Hàng 2: Thứ Hai (Gộp 2 hàng bằng rowspan="2") -->
      <tr>
        <td rowspan="2">Thứ Hai</td>
        <td>Toán</td>
        <td>Thầy Nam</td>
      </tr>

      <!-- Hàng 3: Môn thứ 2 của Thứ Hai (Không cần khai báo ô Thứ nữa) -->
      <tr>
        <td>Văn</td>
        <td>Cô Hạnh</td>
      </tr>

      <!-- Hàng 4: Thứ Ba (Gộp 2 cột bằng colspan="2") -->
      <tr>
        <td>Thứ Ba</td>
        <td colspan="2">Nghỉ học</td>
      </tr>
    </table>
  </body>
</html>
