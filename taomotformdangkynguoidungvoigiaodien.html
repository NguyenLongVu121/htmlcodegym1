<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Form Đăng Ký Người Dùng</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      form {
        width: 350px;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 5px;
        background-color: #f9f9f9;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .form-group input[type="text"],
      .form-group input[type="email"],
      .form-group input[type="tel"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <!-- 
      - Action: http://demo.codegym.vn/6/registration_form/register.php
      - Method: POST
    -->
    <form
      action="http://demo.codegym.vn/6/registration_form/register.php"
      method="POST"
    >
      <h2>Đăng ký người dùng</h2>

      <!-- Trường Họ và tên có name="name" -->
      <div class="form-group">
        <label>Họ và tên:</label>
        <input type="text" name="name" placeholder="Nhập họ và tên" required />
      </div>

      <!-- Trường Email có name="email" -->
      <div class="form-group">
        <label>Email:</label>
        <input type="email" name="email" placeholder="Nhập email" required />
      </div>

      <!-- Trường Số điện thoại có name="phone" -->
      <div class="form-group">
        <label>Số điện thoại:</label>
        <input
          type="tel"
          name="phone"
          placeholder="Nhập số điện thoại"
          required
        />
      </div>

      <!-- Trường Giới tính có name="gender" -->
      <div class="form-group">
        <label>Giới tính:</label>
        <input type="radio" name="gender" value="Nam" checked /> Nam
        <input type="radio" name="gender" value="Nữ" /> Nữ
      </div>

      <!-- Nút gửi dữ liệu -->
      <div class="form-group">
        <input type="submit" value="Đăng ký" />
      </div>
    </form>
  </body>
</html>
