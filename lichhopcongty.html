<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Lịch họp công ty</title>
  </head>
  <body>
    <!-- Tiêu đề h1 đúng yêu cầu đề bài -->
    <h1>Lịch họp công ty</h1>

    <!-- Bảng hiển thị thông tin lịch họp -->
    <table border="1">
      <!-- Tiêu đề các cột: Ngày, Giờ, Nội dung cuộc họp -->
      <tr>
        <th>Ngày</th>
        <th>Giờ</th>
        <th>Nội dung cuộc họp</th>
      </tr>

      <!-- Thứ Hai: Có 2 cuộc họp trong cùng 1 ngày -> Sử dụng rowspan="2" ở cột Ngày -->
      <tr>
        <td rowspan="2">Thứ Hai</td>
        <td>08:00 - 09:30</td>
        <td>Họp giao ban đầu tuần</td>
      </tr>
      <tr>
        <td>14:00 - 16:00</td>
        <td>Họp với phòng Marketing</td>
      </tr>

      <!-- Thứ Ba: Cuộc họp kéo dài cả buổi -> Sử dụng colspan="2" ở cột Giờ và Nội dung hoặc kết hợp -->
      <tr>
        <td>Thứ Ba</td>
        <td colspan="2">Nghỉ lễ / Không có lịch họp</td>
      </tr>

      <!-- Thứ Tư: Cuộc họp kéo dài nhiều giờ (gộp thông tin thời gian & nội dung) -->
      <tr>
        <td rowspan="2">Thứ Tư</td>
        <td>09:00 - 11:30</td>
        <td>Review dự án mới</td>
      </tr>
      <tr>
        <td colspan="2">14:00 - 17:00: Training nhân viên mới (Cả chiều)</td>
      </tr>
    </table>
  </body>
</html>
