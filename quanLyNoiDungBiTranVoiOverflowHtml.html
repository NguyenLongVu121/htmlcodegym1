    <title>Quản lý Overflow</title>

  <body>
    <div class="overflow-box">
      Đây là một đoạn văn bản rất dài mà chúng ta sẽ kiểm tra cách overflow hoạt
      động. Khi nội dung bên trong vượt quá chiều cao hoặc chiều rộng được thiết
      lập sẵn của khối chứa, thuộc tính overflow: auto sẽ tự động xuất hiện
      thanh cuộn giúp người dùng xem toàn bộ nội dung mà không làm vỡ giao diện.
    </div>
