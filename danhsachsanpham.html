<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Danh sách sản phẩm</title>
  </head>
  <body>
    <!-- Tiêu đề h1 đúng yêu cầu đề bài -->
    <h1>Danh sách sản phẩm</h1>

    <!-- Bảng chứa danh sách các sản phẩm -->
    <table border="1">
      <!-- Tiêu đề các cột: Tên sản phẩm, Giá, Số lượng -->
      <tr>
        <th>Tên sản phẩm</th>
        <th>Giá</th>
        <th>Số lượng</th>
      </tr>

      <!-- Sản phẩm 1 -->
      <tr>
        <td>Điện thoại iPhone 15</td>
        <td>22.990.000 VNĐ</td>
        <td>10</td>
      </tr>

      <!-- Sản phẩm 2 -->
      <tr>
        <td>Laptop Dell XPS 13</td>
        <td>35.500.000 VNĐ</td>
        <td>5</td>
      </tr>

      <!-- Sản phẩm 3 -->
      <tr>
        <td>Tai nghe AirPods Pro</td>
        <td>5.490.000 VNĐ</td>
        <td>15</td>
      </tr>

      <!-- Sản phẩm 4 -->
      <tr>
        <td>Bàn phím cơ Logi</td>
        <td>2.100.000 VNĐ</td>
        <td>8</td>
      </tr>
    </table>
  </body>
</html>
