<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành grid-column-start Property</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2 style="text-align: center; margin-top: 20px">
      Thực hành Thuộc tính grid-column-start
    </h2>

    <h3>1. Đặt vị trí bắt đầu theo chỉ số đường lưới (grid-line)</h3>
    <div class="grid-container">
      <div class="item item1">Item 1 (bắt đầu từ cột 2)</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
    </div>

    <h3>2. Sử dụng từ khóa span (kéo dài độ rộng cột)</h3>
    <div class="grid-container">
      <div class="item item2">Item A (span 2)</div>
      <div class="item">Item B</div>
      <div class="item">Item C</div>
      <div class="item">Item D</div>
    </div>
  </body>
</html>
