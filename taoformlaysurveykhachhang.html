<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Market Research Survey</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        color: #333;
      }
      form {
        width: 600px;
      }
      h2 {
        margin-bottom: 5px;
      }
      p.subtitle {
        margin-top: 0;
        color: #666;
        font-size: 14px;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label.question {
        font-weight: bold;
        display: block;
        margin-bottom: 8px;
      }
      select {
        padding: 5px;
        width: 300px;
      }
      .radio-group,
      .checkbox-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .price-inputs {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .price-inputs input {
        width: 50px;
        padding: 4px;
      }
      .price-label {
        font-size: 12px;
        color: #555;
      }
      textarea {
        width: 100%;
        height: 100px;
        padding: 8px;
      }
      .submit-btn {
        background-color: #4caf50;
        color: white;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 4px;
      }
      .submit-btn:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <h2>Market Research Survey</h2>
    <p class="subtitle">
      Please take a few moments to complete this satisfaction survey.
    </p>

    <form action="#" method="POST">
      <!-- 1. What is your age range? -->
      <div class="form-group">
        <label class="question">What is your age range?</label>
        <select name="age_range">
          <option value="18-24">18-24</option>
          <option value="25-34">25-34</option>
          <option value="35-44">35-44</option>
          <option value="45+">45+</option>
        </select>
      </div>

      <!-- 2. What is your yearly income range? -->
      <div class="form-group">
        <label class="question">What is your yearly income range?</label>
        <select name="income_range">
          <option value="0-25000">$0 - $25,000</option>
          <option value="25001-50000">$25,001 - $50,000</option>
          <option value="50001-100000">$50,001 - $100,000</option>
          <option value="100000+">$100,000+</option>
        </select>
      </div>

      <!-- 3. Gender Identity -->
      <div class="form-group">
        <label class="question">Gender Identity</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male" /> Male</label>
          <label
            ><input type="radio" name="gender" value="Female" /> Female</label
          >
          <label
            ><input type="radio" name="gender" value="Nonbinary" />
            Nonbinary</label
          >
          <label>
            <input type="radio" name="gender" value="Other" /> Other
            <input type="text" name="gender_other" style="margin-left: 5px" />
          </label>
        </div>
      </div>

      <!-- 4. Which of the following products... -->
      <div class="form-group">
        <label class="question"
          >Which of the following products have you purchased in the last 2
          months. Please check all that apply.</label
        >
        <div class="checkbox-group">
          <label
            ><input type="checkbox" name="product" value="Product 1" /> Product
            1</label
          >
          <label
            ><input type="checkbox" name="product" value="Product 2" /> Product
            2</label
          >
          <label
            ><input type="checkbox" name="product" value="Product 3" /> Product
            3</label
          >
        </div>
      </div>

      <!-- 5. How often would you use our new product? -->
      <div class="form-group">
        <label class="question">How often would you use our new product?</label>
        <div class="radio-group">
          <label
            ><input type="radio" name="frequency" value="Daily" /> Daily</label
          >
          <label
            ><input type="radio" name="frequency" value="Weekly" />
            Weekly</label
          >
          <label
            ><input type="radio" name="frequency" value="Monthly" />
            Monthly</label
          >
        </div>
      </div>

      <!-- 6. What would you pay for the new product? -->
      <div class="form-group">
        <label class="question">What would you pay for the new product?</label>
        <div class="price-inputs">
          $ <input type="text" name="dollars" /> .
          <input type="text" name="cents" />
        </div>
        <div style="display: flex; gap: 40px; margin-top: 3px">
          <span class="price-label" style="margin-left: 12px">Dollars</span>
          <span class="price-label">Cents</span>
        </div>
      </div>

      <!-- 7. What features would you like to see in the new product? -->
      <div class="form-group">
        <label class="question"
          >What features would you like to see in the new product?</label
        >
        <textarea name="features"></textarea>
      </div>

      <!-- Submit Button -->
      <div class="form-group">
        <input type="submit" value="Submit" class="submit-btn" />
      </div>
    </form>
  </body>
</html>
