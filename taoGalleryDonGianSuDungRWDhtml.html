<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 style="text-align: center; margin: 20px 0">Responsive Image Gallery</h1>

    <div class="gallery">
      <div class="responsive">
        <div class="img-box">
          <img src="https://picsum.photos/600/400?random=1" alt="Image 1" />
          <div class="desc">Thêm mô tả cho hình ảnh 1</div>
        </div>
      </div>

      <div class="responsive">
        <div class="img-box">
          <img src="https://picsum.photos/600/400?random=2" alt="Image 2" />
          <div class="desc">Thêm mô tả cho hình ảnh 2</div>
        </div>
      </div>

      <div class="responsive">
        <div class="img-box">
          <img src="https://picsum.photos/600/400?random=3" alt="Image 3" />
          <div class="desc">Thêm mô tả cho hình ảnh 3</div>
        </div>
      </div>

      <div class="responsive">
        <div class="img-box">
          <img src="https://picsum.photos/600/400?random=4" alt="Image 4" />
          <div class="desc">Thêm mô tả cho hình ảnh 4</div>
        </div>
      </div>
    </div>
  </body>
</html>
