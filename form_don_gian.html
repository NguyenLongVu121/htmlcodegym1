<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Bài tập Tạo form đơn giản</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .form-container {
        border: 1px solid #ccc;
        padding: 20px;
        width: 450px;
        margin-bottom: 30px;
        background-color: #f9f9f9;
      }
      .form-header {
        background-color: #008080;
        color: white;
        padding: 10px;
        margin: -20px -20px 20px -20px;
        text-align: center;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: inline-block;
        width: 120px;
      }
    </style>
  </head>
  <body>
    <!-- PHẦN 1: Form Sở Thích -->
    <div class="form-container">
      <div class="form-header">
        <h2>SỞ THÍCH CỦA BẠN</h2>
      </div>
      <form action="#" method="POST">
        <div class="form-group">
          <label>Họ và tên:</label>
          <input type="text" name="yourname" size="30" />
        </div>

        <div class="form-group">
          <label>Email:</label>
          <input type="text" name="email" size="30" />
        </div>

        <div class="form-group">
          <label>Sở thích:</label><br />
          <input type="checkbox" name="hobby" value="the_thao" /> Thể thao
          <input type="checkbox" name="hobby" value="am_nhac" /> Âm nhạc
          <input type="checkbox" name="hobby" value="doc_sach" /> Đọc sách
          <br />
          <input type="checkbox" name="hobby" value="lướt_web" /> Lướt web
          <input type="checkbox" name="hobby" value="chơi_game" /> Chơi game
          <input type="checkbox" name="hobby" value="đi_du_lịch" /> Đi du lịch
        </div>

        <div class="form-group">
          <input type="submit" value="Gửi thông tin" />
          <input type="reset" value="Nhập lại" />
        </div>
      </form>
    </div>

    <!-- PHẦN 2: Form Đăng Ký Học Viên -->
    <div class="form-container">
      <div class="form-header" style="background-color: #d9534f">
        <h2>ĐĂNG KÝ HỌC VIÊN</h2>
      </div>
      <form action="#" method="POST">
        <div class="form-group">
          <label>Họ và tên:</label>
          <input type="text" name="fullname" size="30" />
        </div>

        <div class="form-group">
          <label>Ngày sinh:</label>
          <input type="date" name="dob" />
        </div>

        <div class="form-group">
          <label>Giới tính:</label>
          <input type="radio" name="gender" value="male" checked /> Nam
          <input type="radio" name="gender" value="female" /> Nữ
        </div>

        <div class="form-group">
          <label>Địa chỉ:</label>
          <textarea name="address" rows="3" cols="30"></textarea>
        </div>

        <div class="form-group">
          <label>Lớp học:</label>
          <select name="class">
            <option value="java">Java</option>
            <option value="php">PHP</option>
            <option value="python">Python</option>
          </select>
        </div>

        <div class="form-group">
          <label>Email:</label>
          <input type="email" name="user_email" size="30" />
        </div>

        <div class="form-group">
          <label>Điện thoại:</label>
          <input type="tel" name="phone" size="30" />
        </div>

        <div class="form-group">
          <input type="submit" value="Đăng ký" />
          <input type="reset" value="Nhập lại" />
        </div>
      </form>
    </div>
  </body>
</html>
